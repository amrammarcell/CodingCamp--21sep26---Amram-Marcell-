<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense &amp; Budget Visualizer</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ========== Balance Display ========== -->
  <header class="balance-section" role="banner">
    <h1 class="app-title">Expense &amp; Budget Visualizer</h1>
    <div class="balance-display" id="balance-display" aria-live="polite" aria-atomic="true">
      <span class="balance-label">Total Pengeluaran</span>
      <span class="balance-amount" id="balance-amount">Rp 0</span>
    </div>
  </header>

  <main class="main-content">

    <!-- ========== Input Form ========== -->
    <section class="form-section" aria-labelledby="form-heading">
      <h2 id="form-heading" class="section-title">Tambah Transaksi</h2>
      <form id="transaction-form" novalidate>

        <div class="form-group">
          <label for="item-name">Nama Item</label>
          <input
            type="text"
            id="item-name"
            name="name"
            maxlength="100"
            placeholder="Contoh: Makan Siang"
            autocomplete="off"
            aria-describedby="name-error"
          />
          <span class="form-error" id="name-error" role="alert" aria-live="polite"></span>
        </div>

        <div class="form-group">
          <label for="item-amount">Jumlah (Amount)</label>
          <input
            type="number"
            id="item-amount"
            name="amount"
            min="0.01"
            step="any"
            placeholder="Contoh: 25000"
            aria-describedby="amount-error"
          />
          <span class="form-error" id="amount-error" role="alert" aria-live="polite"></span>
        </div>

        <div class="form-group">
          <label for="item-category">Kategori</label>
          <select
            id="item-category"
            name="category"
            aria-describedby="category-error"
          >
            <option value="">-- Pilih Kategori --</option>
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Fun">Fun</option>
          </select>
          <span class="form-error" id="category-error" role="alert" aria-live="polite"></span>
        </div>

        <button type="submit" class="btn btn-primary" id="submit-btn">
          Tambah Transaksi
        </button>

        <!-- General form error message -->
        <div class="form-message" id="form-message" role="alert" aria-live="polite"></div>

      </form>
    </section>

    <!-- ========== Transaction List + Chart — side-by-side on desktop ========== -->
    <div class="list-and-chart">

      <!-- ========== Transaction List ========== -->
      <section class="list-section" aria-labelledby="list-heading">
        <div class="list-header">
          <h2 id="list-heading" class="section-title">Riwayat Transaksi</h2>

          <!-- Sort Control -->
          <div class="sort-control">
            <label for="sort-select">Urutkan:</label>
            <select id="sort-select" aria-label="Urutkan transaksi">
              <option value="date-desc">Terbaru</option>
              <option value="amount-asc">Jumlah ↑</option>
              <option value="amount-desc">Jumlah ↓</option>
              <option value="category-asc">Kategori A–Z</option>
            </select>
          </div>
        </div>

        <!-- Transaction list container (scrollable) -->
        <div class="transaction-list-container" role="region" aria-label="Daftar transaksi">
          <ul class="transaction-list" id="transaction-list" aria-label="Riwayat transaksi">
            <!-- Items rendered by app.js -->
          </ul>
          <!-- Empty state (shown when no transactions) -->
          <p class="empty-state" id="empty-state" hidden>
            Belum ada transaksi. Tambahkan transaksi pertama Anda di atas!
          </p>
        </div>

        <!-- Storage / app-level error message -->
        <div class="app-message" id="app-message" role="alert" aria-live="polite"></div>
      </section>

      <!-- ========== Chart ========== -->
      <section class="chart-section" aria-labelledby="chart-heading">
        <h2 id="chart-heading" class="section-title">Distribusi Pengeluaran</h2>

        <div class="chart-container" id="chart-container">
          <!-- Canvas for Chart.js pie chart -->
          <canvas id="expense-chart" aria-label="Pie chart distribusi pengeluaran per kategori" role="img"></canvas>
          <!-- Placeholder shown when no transactions or Chart.js unavailable -->
          <p class="chart-placeholder" id="chart-placeholder">
            Tambahkan transaksi untuk melihat grafik.
          </p>
        </div>
      </section>

    </div><!-- /.list-and-chart -->

  </main>

  <!-- Chart.js via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>

  <!-- App logic -->
  <script src="js/app.js"></script>

</body>
</html>
